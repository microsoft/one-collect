name: CI
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Clippy lints ordered by platform (glibc, musl, windows)
  clippy_linux_glibc_x64:
    uses: ./.github/workflows/clippy.yml
    with:
      os: ubuntu-latest
      platform-name: Linux-glibc-x64

  clippy_linux_musl_x64:
    uses: ./.github/workflows/clippy.yml
    with:
      os: ubuntu-latest
      container: rust:alpine
      setup-command: apk add --no-cache musl-dev
      platform-name: Linux-musl-x64

  clippy_windows_x64:
    uses: ./.github/workflows/clippy.yml
    with:
      os: windows-latest
      platform-name: Windows-x64

  # Cargo doc ordered by platform (glibc, musl, windows)
  doc_linux_glibc_x64:
    uses: ./.github/workflows/cargo-doc.yml
    with:
      os: ubuntu-latest
      platform-name: Linux-glibc-x64

  doc_linux_musl_x64:
    uses: ./.github/workflows/cargo-doc.yml
    with:
      os: ubuntu-latest
      container: rust:alpine
      setup-command: apk add --no-cache musl-dev
      platform-name: Linux-musl-x64

  doc_windows_x64:
    uses: ./.github/workflows/cargo-doc.yml
    with:
      os: windows-latest
      platform-name: Windows-x64

  # Linux builds ordered by platform (glibc, musl) then flavor (debug, release)
  build_linux_glibc_x64_debug:
    uses: ./.github/workflows/build-and-test.yml
    with:
      os: ubuntu-latest
      build-flavor: debug
      platform-name: Linux-glibc-x64

  build_linux_glibc_x64_release:
    uses: ./.github/workflows/build-and-test.yml
    with:
      os: ubuntu-latest
      build-flavor: release
      platform-name: Linux-glibc-x64

  build_linux_musl_x64_debug:
    uses: ./.github/workflows/build-and-test.yml
    with:
      os: ubuntu-latest
      container: rust:alpine
      setup-command: apk add --no-cache musl-dev
      build-flavor: debug
      platform-name: Linux-musl-x64

  build_linux_musl_x64_release:
    uses: ./.github/workflows/build-and-test.yml
    with:
      os: ubuntu-latest
      container: rust:alpine
      setup-command: apk add --no-cache musl-dev
      build-flavor: release
      platform-name: Linux-musl-x64

  # Windows builds ordered by flavor (debug, release)
  build_windows_x64_debug:
    uses: ./.github/workflows/build-and-test.yml
    with:
      os: windows-latest
      build-flavor: debug
      platform-name: Windows-x64

  build_windows_x64_release:
    uses: ./.github/workflows/build-and-test.yml
    with:
      os: windows-latest
      build-flavor: release
      platform-name: Windows-x64

  # ETW integration tests.  Runs each `tests/etw_*_integration.rs`
  # binary which starts a real ETW consumer session: `etw_tdh_integration`
  # emits real ETW TraceLogging events and decodes them through
  # `TdhDecoder`, while `etw_stats_integration` asserts on the live
  # loss/health counters returned by `query_stats`.  Tests are
  # `#[ignore]`'d because they require elevation to start an ETW session;
  # `windows-latest` runners execute as `runneradmin`, which satisfies
  # that.  Targeting each binary by name avoids sweeping up unrelated
  # `#[ignore]`'d unit tests in `src/**`.  `--test-threads=1` serialises
  # the tests because each one owns a process-global ETW consumer session.
  integration_etw_windows_x64:
    name: ETW Integration Tests (Windows-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run etw_tdh_integration
        # The manifest-decode test (`tdh_decodes_compiled_manifest_all_types`)
        # compiles a WES manifest at runtime, so mc.exe / rc.exe / link.exe
        # must be on PATH.  Initialise the VS dev environment via vcvars64
        # (located with vswhere) rather than a third-party action.
        # wevtutil.exe is already on PATH and the runner is `runneradmin`.
        working-directory: one_collect
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          cargo test --locked --test etw_tdh_integration -- --ignored --nocapture --test-threads=1
      - name: Run etw_stats_integration
        working-directory: one_collect
        run: cargo test --locked --test etw_stats_integration -- --ignored --nocapture --test-threads=1

  # Benchmarks ordered by OS (linux, windows) then platform (glibc, musl)
  bench_linux_glibc_x64:
    uses: ./.github/workflows/benchmarks.yml
    with:
      os: ubuntu-latest
      platform-name: Linux-glibc-x64

  bench_linux_musl_x64:
    uses: ./.github/workflows/benchmarks.yml
    with:
      os: ubuntu-latest
      container: rust:alpine
      setup-command: apk add --no-cache musl-dev
      platform-name: Linux-musl-x64

  bench_windows_x64:
    uses: ./.github/workflows/benchmarks.yml
    with:
      os: windows-latest
      platform-name: Windows-x64

  # Docker tests
  docker_console:
    uses: ./.github/workflows/docker-tests.yml

name: CI
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux builds ordered by platform (glibc, musl) then flavor (debug, release)
  build_linux_glibc_x64_debug:
    name: Build and Test (Debug/Linux-glibc-x64)
    uses: ./.github/workflows/build-and-test.yml
    with:
      os: ubuntu-latest
      build-flavor: debug
      platform-name: Linux-glibc-x64

  build_linux_glibc_x64_release:
    name: Build and Test (Release/Linux-glibc-x64)
    uses: ./.github/workflows/build-and-test.yml
    with:
      os: ubuntu-latest
      build-flavor: release
      platform-name: Linux-glibc-x64

  build_linux_musl_x64_debug:
    name: Build and Test (Debug/Linux-musl-x64)
    uses: ./.github/workflows/build-and-test.yml
    with:
      os: ubuntu-latest
      container: rust:alpine
      setup-command: apk add --no-cache musl-dev
      build-flavor: debug
      platform-name: Linux-musl-x64

  build_linux_musl_x64_release:
    name: Build and Test (Release/Linux-musl-x64)
    uses: ./.github/workflows/build-and-test.yml
    with:
      os: ubuntu-latest
      container: rust:alpine
      setup-command: apk add --no-cache musl-dev
      build-flavor: release
      platform-name: Linux-musl-x64

  # Windows builds ordered by flavor (debug, release)
  build_windows_x64_debug:
    name: Build and Test (Debug/Windows-x64)
    uses: ./.github/workflows/build-and-test.yml
    with:
      os: windows-latest
      build-flavor: debug
      platform-name: Windows-x64

  build_windows_x64_release:
    name: Build and Test (Release/Windows-x64)
    uses: ./.github/workflows/build-and-test.yml
    with:
      os: windows-latest
      build-flavor: release
      platform-name: Windows-x64

  # Benchmarks ordered by OS (linux, windows) then platform (glibc, musl)
  bench_linux_glibc_x64:
    name: Run Benchmarks (Linux-glibc-x64)
    uses: ./.github/workflows/benchmarks.yml
    with:
      os: ubuntu-latest
      platform-name: Linux-glibc-x64

  bench_linux_musl_x64:
    name: Run Benchmarks (Linux-musl-x64)
    uses: ./.github/workflows/benchmarks.yml
    with:
      os: ubuntu-latest
      container: rust:alpine
      setup-command: apk add --no-cache musl-dev
      platform-name: Linux-musl-x64

  bench_windows_x64:
    name: Run Benchmarks (Windows-x64)
    uses: ./.github/workflows/benchmarks.yml
    with:
      os: windows-latest
      platform-name: Windows-x64

  # Docker tests
  docker_console:
    name: Run Docker Tests
    uses: ./.github/workflows/docker-tests.yml

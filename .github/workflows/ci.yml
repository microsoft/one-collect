name: CI
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_linux_glibc_x64_debug:
    uses: ./.github/workflows/build-and-test.yml
    with:
      os: ubuntu-latest
      build-mode: debug
      platform-name: Linux-glibc-x64

  build_windows_x64_debug:
    uses: ./.github/workflows/build-and-test.yml
    with:
      os: windows-latest
      build-mode: debug
      platform-name: Windows-x64

  build_linux_glibc_x64_release:
    uses: ./.github/workflows/build-and-test.yml
    with:
      os: ubuntu-latest
      build-mode: release
      platform-name: Linux-glibc-x64

  build_linux_musl_x64_debug:
    uses: ./.github/workflows/build-and-test.yml
    with:
      os: ubuntu-latest
      container: rust:alpine
      setup-command: apk add --no-cache musl-dev
      build-mode: debug
      platform-name: Linux-musl-x64

  build_linux_musl_x64_release:
    uses: ./.github/workflows/build-and-test.yml
    with:
      os: ubuntu-latest
      container: rust:alpine
      setup-command: apk add --no-cache musl-dev
      build-mode: release
      platform-name: Linux-musl-x64

  build_windows_x64_release:
    uses: ./.github/workflows/build-and-test.yml
    with:
      os: windows-latest
      build-mode: release
      platform-name: Windows-x64

  bench_linux_glibc_x64:
    uses: ./.github/workflows/benchmarks.yml
    with:
      os: ubuntu-latest
      platform-name: Linux-glibc-x64

  bench_windows_x64:
    uses: ./.github/workflows/benchmarks.yml
    with:
      os: windows-latest
      platform-name: Windows-x64

  bench_linux_musl_x64:
    uses: ./.github/workflows/benchmarks.yml
    with:
      os: ubuntu-latest
      container: rust:alpine
      setup-command: apk add --no-cache musl-dev
      platform-name: Linux-musl-x64

  docker_console:
    uses: ./.github/workflows/docker-tests.yml
